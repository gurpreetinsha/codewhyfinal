name: CODEWHY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: |
          python -c "from pathlib import Path; html=Path('static/index.html').read_text(); Path('/tmp/codewhy.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/codewhy.js
      - name: Build deployment image
        run: docker build -t codewhy:ci .
      - name: Verify Vercel FastAPI entrypoint and routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.index import app

          client = TestClient(app)
          health = client.get("/api/health")
          assert health.status_code == 200, health.text
          assert health.json()["status"] == "ok", health.text
          homepage = client.get("/")
          assert homepage.status_code == 200, homepage.text
          assert "CODEWHY" in homepage.text
          print("Vercel entrypoint, health route, and homepage passed")
          PY
